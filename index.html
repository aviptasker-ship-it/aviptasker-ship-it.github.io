<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AI Study Assistant | Private Secure Tutor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code syntax -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .chat-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background: #475569; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .typing-dot { animation: typingPulse 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }
        .message-enter { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .sidebar-open { animation: slideIn 0.3s ease-out; }
        pre { border-radius: 0.75rem; overflow-x: auto; padding: 1rem; margin: 0.75rem 0; background: #0f172a !important; }
        code { font-family: 'Courier New', monospace; font-size: 0.875rem; }
        .toast-show { animation: fadeInUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .chat-bubble { word-break: break-word; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 transition-all duration-300">
    <div id="app" class="min-h-screen relative"></div>
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDEw5uEL1WY6VtUZV7yaOBAuqSnwRgltFY",
            authDomain: "marriage-halls.firebaseapp.com",
            databaseURL: "https://marriage-halls-default-rtdb.firebaseio.com",
            projectId: "marriage-halls",
            storageBucket: "marriage-halls.firebasestorage.app",
            messagingSenderId: "343836708279",
            appId: "1:343836708279:web:4d55ca57685bd87fc06c32"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============================================
        // NEW GEMINI API KEY (working with REST endpoint)
        // ============================================
        const GEMINI_API_KEY = "AIzaSyAY2A6xLtr7qPUYhPoiIE_Yc0tLJOt3YuY";
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
        
        // Direct fetch to Gemini API (more reliable than SDK with this key)
        async function generateAIResponse(userMessage, history = []) {
            try {
                // Build conversation context from history
                let conversationParts = [];
                // Add system instruction as first user context
                const systemInstruction = "You are AI Study Assistant, a warm, encouraging tutor for students. Use simple language, step-by-step explanations, emojis occasionally. For code, show formatted examples. For math, show solving process. Keep responses concise (2-3 paragraphs). Never provide harmful content.";
                
                // Add system prompt as a user/assistant primer
                conversationParts.push({ text: systemInstruction + " Remember to be helpful and educational." });
                
                // Add last 6 messages for context
                if (history && history.length > 0) {
                    const recentHistory = history.slice(-6);
                    for (const msg of recentHistory) {
                        const role = msg.role === 'user' ? 'user' : 'model';
                        conversationParts.push({ text: msg.content });
                    }
                }
                // Add current user message
                conversationParts.push({ text: `Student: ${userMessage}\n\nTeacher (AI Study Assistant):` });
                
                const requestBody = {
                    contents: [
                        {
                            parts: conversationParts
                        }
                    ],
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 800,
                        topP: 0.95
                    },
                    safetySettings: [
                        { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
                        { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_MEDIUM_AND_ABOVE" }
                    ]
                };
                
                const response = await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Gemini API error:", response.status, errorText);
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                // Extract text from response
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    return aiText || getFallbackResponse(userMessage);
                } else {
                    console.warn("Unexpected Gemini response structure", data);
                    return getFallbackResponse(userMessage);
                }
            } catch(error) {
                console.error("Gemini fetch error:", error);
                return getFallbackResponse(userMessage);
            }
        }
        
        // Enhanced fallback responses
        function getFallbackResponse(userMessage) {
            const lowerMsg = userMessage.toLowerCase();
            if (lowerMsg.includes('hello') || lowerMsg.includes('hi')) 
                return "Hello! 👋 I'm your private AI Study Assistant. Ask me about math, coding, science, or exam tips! Your chat history stays private to your account.";
            if (lowerMsg.includes('math') || lowerMsg.includes('equation')) 
                return "Let's solve math step-by-step! 📐 Share your equation or problem. For example: 'Solve 2x + 5 = 15' or 'Find the derivative of x²'. I'll explain each step clearly.";
            if (lowerMsg.includes('code') || lowerMsg.includes('python') || lowerMsg.includes('javascript')) 
                return "💻 Coding help is here! Share your code or describe what you're building. I can explain loops, functions, classes, and debug errors line by line. What language are you using?";
            if (lowerMsg.includes('science') || lowerMsg.includes('physics') || lowerMsg.includes('chemistry')) 
                return "🔬 Science is amazing! I can help with Newton's laws, chemical reactions, cell biology, and more. Which topic are you studying?";
            if (lowerMsg.includes('exam') || lowerMsg.includes('test') || lowerMsg.includes('study')) 
                return "📚 Exam prep tips: 1) Active recall - test yourself, 2) Spaced repetition - review over time, 3) Practice problems daily, 4) Teach concepts to others. What subject are you preparing for?";
            return "I'm your study buddy! 📖 I can help with:\n• Mathematics (algebra, calculus, geometry)\n• Programming (Python, JS, HTML/CSS)\n• Science (physics, chemistry, biology)\n• English & writing\n• Study strategies & exam prep\n\nWhat would you like to learn today?";
        }
        
        // Helper functions
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-24 left-1/2 transform -translate-x-1/2 px-5 py-3 rounded-xl text-white text-sm z-50 toast-show shadow-lg ${type === 'error' ? 'bg-red-500' : 'bg-green-500'}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mr-2"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function formatDate(date) { 
            return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' }); 
        }
        
        function escapeHtml(text) { 
            if(!text) return ''; 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }
        
        function renderMarkdown(content) {
            if(typeof marked === 'undefined') return escapeHtml(content);
            try {
                return marked.parse(content, { 
                    breaks: true, 
                    highlight: function(code, lang) { 
                        if(lang && hljs.getLanguage(lang)) 
                            return hljs.highlight(code, { language: lang }).value; 
                        return hljs.highlightAuto(code).value; 
                    } 
                });
            } catch(e) { return escapeHtml(content); }
        }
        
        function scrollToBottom() { 
            setTimeout(() => { 
                const container = document.getElementById('chat-messages-container'); 
                if(container) container.scrollTop = container.scrollHeight; 
            }, 100); 
        }
        
        // Voice input
        function startVoiceInput(onResult) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { showToast("Voice not supported", 'error'); return null; }
            const recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.interimResults = false; 
            recognition.lang = 'en-US';
            recognition.onresult = (event) => { 
                const text = event.results[0][0].transcript; 
                if(onResult) onResult(text); 
            };
            recognition.onerror = () => showToast("Speech error", 'error');
            recognition.start();
            return recognition;
        }
        
        function speakText(text) { 
            if(window.currentUtterance) window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text); 
            utterance.rate = 0.9; 
            window.currentUtterance = utterance; 
            window.speechSynthesis.speak(utterance); 
        }
        
        // ========== FIREBASE: PER-USER ISOLATED STORAGE ==========
        async function saveUserToDatabase(user) {
            try {
                const userRef = database.ref(`users/${user.uid}`);
                const snapshot = await userRef.once('value');
                if(!snapshot.exists()) {
                    await userRef.set({ 
                        email: user.email, 
                        displayName: user.displayName || user.email.split('@')[0], 
                        createdAt: new Date().toISOString() 
                    });
                }
                return true;
            } catch(e) { return false; }
        }
        
        async function saveMessageToFirebase(userId, sessionId, message) {
            try {
                const messageRef = database.ref(`users/${userId}/chatMessages/${sessionId}`).push();
                await messageRef.set({ ...message, timestamp: new Date().toISOString() });
                const sessionRef = database.ref(`users/${userId}/chatSessions/${sessionId}`);
                const snap = await sessionRef.once('get');
                if(snap.exists()) {
                    const curr = snap.val();
                    await sessionRef.update({ updatedAt: new Date().toISOString(), messageCount: (curr.messageCount || 0) + 1 });
                }
                return true;
            } catch(e) { return false; }
        }
        
        async function createNewSession(userId, title, firstMessage) {
            try {
                const sessionsRef = database.ref(`users/${userId}/chatSessions`);
                const newSessionRef = sessionsRef.push();
                const sessionId = newSessionRef.key;
                const timestamp = new Date().toISOString();
                await newSessionRef.set({ 
                    id: sessionId, 
                    title: title || `Chat ${new Date().toLocaleString()}`, 
                    createdAt: timestamp, 
                    updatedAt: timestamp, 
                    messageCount: 1 
                });
                await saveMessageToFirebase(userId, sessionId, firstMessage);
                return sessionId;
            } catch(e) { return null; }
        }
        
        async function loadUserSessions(userId) {
            try {
                const snapshot = await database.ref(`users/${userId}/chatSessions`).once('value');
                if(snapshot.exists()) {
                    const sessionsData = snapshot.val();
                    const sessionsList = Object.values(sessionsData).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                    window.sessions = sessionsList;
                } else { window.sessions = []; }
                renderSidebar();
                return window.sessions;
            } catch(e) { window.sessions = []; renderSidebar(); return []; }
        }
        
        async function loadSessionMessages(userId, sessionId) {
            try {
                const snapshot = await database.ref(`users/${userId}/chatMessages/${sessionId}`).once('value');
                if(snapshot.exists()) {
                    const messagesData = snapshot.val();
                    const messagesList = Object.values(messagesData);
                    window.messages = messagesList;
                    window.currentSessionId = sessionId;
                } else { window.messages = []; }
                renderChatMessages();
                return window.messages;
            } catch(e) { window.messages = []; renderChatMessages(); return []; }
        }
        
        async function deleteSessionFromFirebase(userId, sessionId) {
            try {
                await database.ref(`users/${userId}/chatSessions/${sessionId}`).remove();
                await database.ref(`users/${userId}/chatMessages/${sessionId}`).remove();
                if(window.currentSessionId === sessionId) { 
                    window.messages = []; 
                    window.currentSessionId = null; 
                    renderChatMessages(); 
                }
                await loadUserSessions(userId);
                showToast("Chat history deleted permanently");
            } catch(e) { showToast("Delete failed", 'error'); }
        }
        
        async function updateSessionTitle(userId, sessionId, firstUserMessage) {
            if(!firstUserMessage) return;
            const shortTitle = firstUserMessage.length > 40 ? firstUserMessage.substring(0, 40) + "..." : firstUserMessage;
            const sessionRef = database.ref(`users/${userId}/chatSessions/${sessionId}`);
            await sessionRef.update({ title: shortTitle });
            await loadUserSessions(userId);
        }
        
        // ========== SEND MESSAGE CORE ==========
        window.sendMessage = async function(content) {
            if(!window.currentUser) { showToast("Please login", 'error'); return; }
            if(window.isGenerating) return;
            if(!content.trim()) return;
            
            const userMessage = { role: 'user', content: content.trim() };
            window.messages.push(userMessage);
            renderChatMessages();
            
            let sessionId = window.currentSessionId;
            if(!sessionId) {
                const title = content.slice(0, 50);
                sessionId = await createNewSession(window.currentUser.uid, title, userMessage);
                if(sessionId) {
                    window.currentSessionId = sessionId;
                    await updateSessionTitle(window.currentUser.uid, sessionId, content);
                    await loadUserSessions(window.currentUser.uid);
                }
            } else {
                await saveMessageToFirebase(window.currentUser.uid, sessionId, userMessage);
                if(window.messages.length === 1) await updateSessionTitle(window.currentUser.uid, sessionId, content);
            }
            
            window.isGenerating = true;
            renderTypingIndicator(true);
            
            const history = window.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
            const aiResponse = await generateAIResponse(content, history);
            
            renderTypingIndicator(false);
            
            const aiMessage = { role: 'assistant', content: aiResponse };
            window.messages.push(aiMessage);
            if(sessionId) {
                await saveMessageToFirebase(window.currentUser.uid, sessionId, aiMessage);
                await loadUserSessions(window.currentUser.uid);
            }
            window.isGenerating = false;
            renderChatMessages();
            scrollToBottom();
        };
        
        function renderTypingIndicator(show) {
            const container = document.getElementById('chat-messages-container');
            if(!container) return;
            let indicator = document.getElementById('typing-indicator');
            if(show) {
                if(!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'typing-indicator';
                    indicator.className = 'flex justify-start mb-4 message-enter';
                    indicator.innerHTML = `<div class="bg-gray-100 dark:bg-gray-800 rounded-2xl rounded-tl-sm px-5 py-3"><div class="flex gap-1.5"><div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div><div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div><div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div></div><span class="text-xs text-gray-500 mt-1 block">AI is thinking...</span></div>`;
                    container.appendChild(indicator);
                    scrollToBottom();
                }
            } else { if(indicator) indicator.remove(); }
        }
        
        function renderChatMessages() {
            const container = document.getElementById('chat-messages-container');
            if(!container) return;
            if(!window.messages || window.messages.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center text-gray-500 dark:text-gray-400 px-4 py-12"><div class="w-28 h-28 bg-gradient-to-r from-blue-500 to-purple-500 rounded-3xl flex items-center justify-center mb-6 shadow-xl"><i class="fas fa-graduation-cap text-white text-5xl"></i></div><h2 class="text-3xl font-bold mb-3 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">AI Study Assistant</h2><p class="text-lg mb-6">Your private tutor — chat history is yours alone, secured by email login</p><div class="flex flex-wrap gap-2 justify-center"><span class="px-3 py-1.5 bg-white dark:bg-gray-800 rounded-full text-sm shadow-sm">📚 Explain concepts</span><span class="px-3 py-1.5 bg-white dark:bg-gray-800 rounded-full text-sm shadow-sm">💻 Help with code</span><span class="px-3 py-1.5 bg-white dark:bg-gray-800 rounded-full text-sm shadow-sm">🔢 Solve math</span><span class="px-3 py-1.5 bg-white dark:bg-gray-800 rounded-full text-sm shadow-sm">📖 Study tips</span></div></div>`;
                return;
            }
            let html = '<div class="max-w-4xl mx-auto">';
            for(let msg of window.messages) {
                const isUser = msg.role === 'user';
                const renderedContent = isUser ? escapeHtml(msg.content) : renderMarkdown(msg.content);
                html += `<div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-4 message-enter"><div class="max-w-[85%] ${isUser ? 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-2xl rounded-tr-sm' : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-2xl rounded-tl-sm shadow-md'} px-4 py-3">${!isUser ? `<div class="flex items-center gap-2 mb-2"><i class="fas fa-robot text-blue-500 text-sm"></i><span class="text-xs font-semibold text-blue-600 dark:text-blue-400">AI Study Assistant</span></div>` : ''}<div class="prose prose-sm dark:prose-invert max-w-none chat-bubble ${isUser ? 'text-white' : ''}">${renderedContent}</div><div class="flex items-center justify-end gap-3 mt-2 opacity-70 hover:opacity-100 transition"><button onclick="window.copyToClipboard(\`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)" class="text-xs"><i class="far fa-copy"></i></button>${!isUser ? `<button onclick="window.speakText(\`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)" class="text-xs"><i class="fas fa-volume-up"></i></button>` : ''}</div></div></div>`;
            }
            html += '</div>';
            container.innerHTML = html;
            if(typeof hljs !== 'undefined') document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            scrollToBottom();
        }
        
        window.copyToClipboard = function(text) { navigator.clipboard.writeText(text); showToast("Copied!"); };
        window.speakText = speakText;
        
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-content');
            if(!sidebar) return;
            if(!window.sessions || window.sessions.length === 0) {
                sidebar.innerHTML = `<div class="text-center text-gray-500 dark:text-gray-400 py-12"><i class="fas fa-comments text-4xl mb-3 opacity-50"></i><p class="text-sm">No chats yet</p><p class="text-xs mt-1">Your history is private — only you can see it</p></div>`;
                return;
            }
            sidebar.innerHTML = window.sessions.map(session => `
                <div onclick="window.loadSession('${session.id}')" class="group p-3 rounded-lg cursor-pointer transition-all hover:bg-gray-100 dark:hover:bg-gray-800 ${window.currentSessionId === session.id ? 'bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500' : ''}">
                    <div class="flex items-start justify-between">
                        <div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 dark:text-white truncate">${escapeHtml(session.title || 'Chat')}</p><p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${formatDate(session.updatedAt)}</p></div>
                        <button onclick="event.stopPropagation(); window.deleteSession('${session.id}')" class="opacity-0 group-hover:opacity-100 p-1.5 rounded hover:bg-red-100 dark:hover:bg-red-900/20 transition"><i class="fas fa-trash-alt text-red-500 text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }
        
        window.loadSession = async (sessionId) => {
            if(window.currentUser) {
                await loadSessionMessages(window.currentUser.uid, sessionId);
                renderSidebar();
                if(window.innerWidth < 768) toggleSidebar();
                scrollToBottom();
            }
        };
        
        window.deleteSession = async (sessionId) => {
            if(window.currentUser && confirm('Delete this chat history? It will be removed permanently from your account.')) {
                await deleteSessionFromFirebase(window.currentUser.uid, sessionId);
            }
        };
        
        window.newChat = async () => {
            window.messages = [];
            window.currentSessionId = null;
            renderChatMessages();
            renderSidebar();
            if(window.innerWidth < 768) toggleSidebar();
        };
        
        function toggleSidebar() {
            window.sidebarOpen = !window.sidebarOpen;
            const sidebarEl = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if(window.sidebarOpen) {
                sidebarEl.classList.remove('hidden');
                overlay.classList.remove('hidden');
                setTimeout(() => sidebarEl.classList.add('sidebar-open'), 10);
            } else {
                sidebarEl.classList.remove('sidebar-open');
                setTimeout(() => { sidebarEl.classList.add('hidden'); overlay.classList.add('hidden'); }, 300);
            }
        }
        
        function toggleDarkMode() {
            window.darkMode = !window.darkMode;
            localStorage.setItem('darkMode', window.darkMode);
            if(window.darkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
            else { document.documentElement.classList.remove('dark'); document.body.classList.remove('dark'); }
            renderChatMessages();
        }
        
        // ========== AUTHENTICATION UI ==========
        function renderAuthScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-purple-50 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 p-4"><div class="w-full max-w-md"><div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20"><div class="text-center mb-8"><div class="w-24 h-24 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-5"><i class="fas fa-graduation-cap text-white text-4xl"></i></div><h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">AI Study Assistant</h1><p class="text-gray-500 dark:text-gray-400">Private & Secure — Each email has isolated history</p></div><div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-600 rounded-lg text-sm text-center"></div><button onclick="window.handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition mb-4"><i class="fab fa-google text-red-500"></i><span>Continue with Google</span></button><div class="relative my-6"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div><div class="relative flex justify-center text-sm"><span class="px-3 bg-white dark:bg-slate-800 text-gray-500">OR</span></div></div><form id="email-login-form"><input type="email" id="login-email" placeholder="Email Address" class="w-full px-4 py-3 mb-3 bg-gray-50 dark:bg-slate-700 border rounded-xl focus:ring-2 focus:ring-blue-500" required><input type="password" id="login-password" placeholder="Password" class="w-full px-4 py-3 mb-4 bg-gray-50 dark:bg-slate-700 border rounded-xl focus:ring-2 focus:ring-blue-500" required><button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3 rounded-xl font-semibold">Sign In</button></form><p class="text-center text-sm text-gray-600 mt-6">Don't have an account? <a href="#" onclick="window.showSignup()" class="text-blue-600 font-semibold">Create Account</a></p></div></div></div>`;
            document.getElementById('email-login-form').addEventListener('submit', async(e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errDiv = document.getElementById('auth-error');
                try { const userCred = await auth.signInWithEmailAndPassword(email, password); await saveUserToDatabase(userCred.user); }
                catch(error) { errDiv.textContent = error.message; errDiv.classList.remove('hidden'); }
            });
        }
        
        window.showSignup = function() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-purple-50 p-4"><div class="w-full max-w-md"><div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-2xl p-8"><div class="text-center mb-8"><div class="w-24 h-24 bg-gradient-to-r from-blue-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto mb-5"><i class="fas fa-user-plus text-white text-4xl"></i></div><h1 class="text-3xl font-bold text-gray-800 dark:text-white">Create Account</h1><p class="text-gray-500">Your private study space — history never shared</p></div><div id="auth-error" class="hidden mb-4 p-3 bg-red-100 text-red-600 rounded-lg text-sm"></div><button onclick="window.handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 px-4 py-3 border rounded-xl hover:bg-gray-50 mb-4"><i class="fab fa-google text-red-500"></i>Google</button><div class="relative my-6"><div class="border-t"></div><div class="relative flex justify-center text-sm"><span class="px-3 bg-white dark:bg-slate-800">OR</span></div></div><form id="signup-form"><input type="text" id="signup-name" placeholder="Full Name" class="w-full px-4 py-3 mb-3 bg-gray-50 border rounded-xl" required><input type="email" id="signup-email" placeholder="Email" class="w-full px-4 py-3 mb-3 bg-gray-50 border rounded-xl" required><input type="password" id="signup-password" placeholder="Password (min 6)" class="w-full px-4 py-3 mb-4 bg-gray-50 border rounded-xl" required><button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3 rounded-xl font-semibold">Sign Up</button></form><p class="text-center text-sm mt-6">Already have an account? <a href="#" onclick="window.renderAuthScreen()" class="text-blue-600 font-semibold">Sign In</a></p></div></div></div>`;
            document.getElementById('signup-form').addEventListener('submit', async(e) => {
                e.preventDefault();
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                const errDiv = document.getElementById('auth-error');
                if(password.length < 6) { errDiv.textContent = 'Password must be at least 6 characters'; errDiv.classList.remove('hidden'); return; }
                try {
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await userCred.user.updateProfile({ displayName: name });
                    await saveUserToDatabase({ ...userCred.user, displayName: name });
                } catch(error) { errDiv.textContent = error.message; errDiv.classList.remove('hidden'); }
            });
        };
        
        window.handleGoogleLogin = async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { const result = await auth.signInWithPopup(provider); await saveUserToDatabase(result.user); }
            catch(error) { showToast(error.message, 'error'); }
        };
        
        window.renderAuthScreen = renderAuthScreen;
        
        // ========== MAIN CHAT UI ==========
        function renderChatUI() {
            const app = document.getElementById('app');
            app.innerHTML = `<div><div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div><div id="sidebar" class="fixed top-0 left-0 h-full w-80 bg-white dark:bg-slate-900 shadow-2xl z-50 hidden flex flex-col"><div class="p-4 border-b flex items-center justify-between"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-500 rounded-lg flex items-center justify-center"><i class="fas fa-graduation-cap text-white text-sm"></i></div><span class="font-bold">Study Assistant</span></div><button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 md:hidden"><i class="fas fa-times"></i></button></div><div class="p-4 border-b"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-white font-bold text-lg">${window.currentUser?.displayName?.[0] || window.currentUser?.email?.[0]?.toUpperCase() || 'U'}</div><div class="flex-1"><p class="font-medium truncate">${escapeHtml(window.currentUser?.displayName || window.currentUser?.email?.split('@')[0])}</p><p class="text-xs text-gray-500 truncate">${window.currentUser?.email}</p></div></div></div><div class="p-4"><button onclick="window.newChat()" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-2.5 rounded-xl font-medium flex items-center justify-center gap-2"><i class="fas fa-plus"></i> New Chat</button></div><div id="sidebar-content" class="flex-1 overflow-y-auto px-2"></div><div class="p-4 border-t space-y-2"><button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100"><i class="fas ${window.darkMode ? 'fa-sun' : 'fa-moon'}"></i><span>${window.darkMode ? 'Light Mode' : 'Dark Mode'}</span></button><button onclick="firebase.auth().signOut()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-red-50 text-red-600"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></button></div></div><div class="flex flex-col h-screen"><div class="glass px-4 py-3 flex items-center gap-3 sticky top-0 z-30"><button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100"><i class="fas fa-bars text-gray-700 dark:text-gray-300 text-xl"></i></button><div class="flex items-center gap-2"><div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-500 rounded-lg flex items-center justify-center"><i class="fas fa-graduation-cap text-white text-sm"></i></div><h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">AI Study Assistant</h1></div><div class="ml-auto text-xs text-gray-500"><i class="fas fa-lock text-green-500 mr-1"></i> Private History (Email-isolated)</div></div><div id="chat-messages-container" class="flex-1 overflow-y-auto p-4 chat-scroll"></div><div class="p-4 glass border-t"><div class="flex gap-2"><textarea id="message-input" rows="1" placeholder="Ask me anything... (Your chats are private to your email account)" class="flex-1 px-4 py-3 bg-gray-50 dark:bg-slate-800 border rounded-xl focus:ring-2 focus:ring-blue-500 resize-none" style="min-height: 50px;"></textarea><button id="voice-btn" class="px-4 rounded-xl bg-gray-100 dark:bg-slate-800 hover:bg-gray-200"><i class="fas fa-microphone text-gray-600"></i></button><button id="send-btn" class="px-5 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 text-white"><i class="fas fa-paper-plane text-lg"></i></button></div></div></div></div>`;
            renderChatMessages();
            loadUserSessions(window.currentUser.uid);
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const voiceBtn = document.getElementById('voice-btn');
            sendBtn.onclick = () => { const text = messageInput.value.trim(); if(text) { messageInput.value = ''; window.sendMessage(text); } };
            messageInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } };
            voiceBtn.onclick = () => { const origIcon = voiceBtn.innerHTML; voiceBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-red-500"></i>'; const recog = startVoiceInput((text) => { messageInput.value = text; window.sendMessage(text); voiceBtn.innerHTML = origIcon; }); setTimeout(() => { if(recog) recog.abort(); voiceBtn.innerHTML = origIcon; }, 10000); };
        }
        
        // Initialize application state
        window.messages = [];
        window.sessions = [];
        window.currentSessionId = null;
        window.isGenerating = false;
        window.darkMode = localStorage.getItem('darkMode') === 'true';
        if(window.darkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
        
        auth.onAuthStateChanged(async (user) => {
            window.currentUser = user;
            if(user) { await saveUserToDatabase(user); renderChatUI(); }
            else { renderAuthScreen(); }
        });
    </script>
</body>
    </html>
