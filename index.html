<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SBT Public School | AI Study Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for code syntax -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background: #374151; }
        .message-enter { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .typing-dot { animation: typingPulse 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
        .chat-bubble { word-break: break-word; line-height: 1.5; }
        pre { border-radius: 0.5rem; overflow-x: auto; padding: 0.75rem; margin: 0.5rem 0; background: #1e1e2f !important; font-size: 0.75rem; }
        code { font-family: 'Courier New', monospace; font-size: 0.75rem; }
        .toast-show { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        body { background: #ffffff; }
        .dark body { background: #1e1e2f; }
        input, textarea { outline: none; }
    </style>
</head>
<body class="bg-white dark:bg-[#1e1e2f] transition-colors duration-200">
    <div id="app" class="min-h-screen relative"></div>
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDEw5uEL1WY6VtUZV7yaOBAuqSnwRgltFY",
            authDomain: "marriage-halls.firebaseapp.com",
            databaseURL: "https://marriage-halls-default-rtdb.firebaseio.com",
            projectId: "marriage-halls",
            storageBucket: "marriage-halls.firebasestorage.app",
            messagingSenderId: "343836708279",
            appId: "1:343836708279:web:4d55ca57685bd87fc06c32"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============================================
        // NEW GEMINI API KEY (Provided by user)
        // ============================================
        const GEMINI_API_KEY = "AIzaSyAA32bay5tOIsjQjm0cednmvRoOaOXa6mE";
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";
        
        // Smooth voice function
        function speakWithCuteVoice(text) {
            if (window.currentUtterance) window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.15;
            utterance.volume = 1;
            utterance.lang = 'en-US';
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Google UK English Female') || v.name.includes('Samantha'));
            if (preferredVoice) utterance.voice = preferredVoice;
            window.currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        }
        
        // AI Response Generator with step-by-step explanations
        async function generateAIResponse(userMessage, history = []) {
            try {
                const conversationParts = [];
                const systemInstruction = `You are "SBT Public School AI Tutor" - a warm, patient teacher for students. IMPORTANT RULES:
- Explain EVERY topic STEP-BY-STEP like teaching a 10th grade student
- Use simple language, emojis occasionally, be encouraging
- For math: show formula → substitution → calculation → answer
- For coding: show code → explain each line → output
- For science: concept → real-life example → how it works
- Keep responses clear and organized (2-4 paragraphs or bullet points)
- End with a friendly follow-up question like "Would you like me to explain more?"`;
                
                conversationParts.push({ text: systemInstruction });
                if (history && history.length > 0) {
                    const recentHistory = history.slice(-6);
                    for (const msg of recentHistory) {
                        conversationParts.push({ text: msg.content });
                    }
                }
                conversationParts.push({ text: `Student: ${userMessage}\n\nSBT Tutor (give step-by-step explanation):` });
                
                const requestBody = {
                    contents: [{ parts: conversationParts }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 1000, topP: 0.95 }
                };
                
                const response = await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Gemini API error:", response.status, errorText);
                    throw new Error(`API error: ${response.status}`);
                }
                const data = await response.json();
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                    return data.candidates[0].content.parts[0].text || getFallbackResponse(userMessage);
                }
                return getFallbackResponse(userMessage);
            } catch(error) {
                console.error("Gemini error:", error);
                return getFallbackResponse(userMessage);
            }
        }
        
        function getFallbackResponse(userMessage) {
            const lower = userMessage.toLowerCase();
            if (lower.includes('math') || lower.includes('solve') || lower.includes('equation')) {
                return "📐 **Step-by-Step Math Solution**\n\n1️⃣ **Understand the problem**: Write what's given and what to find\n2️⃣ **Choose the right formula**: Select the equation that connects values\n3️⃣ **Substitute numbers**: Plug in the known values\n4️⃣ **Calculate carefully**: Solve one operation at a time\n5️⃣ **Verify your answer**: Check if it makes sense\n\n💡 Example: Solve 2x + 5 = 15\n→ Subtract 5: 2x = 10\n→ Divide by 2: x = 5\n\nWant me to solve a specific problem for you? 📝";
            }
            if (lower.includes('code') || lower.includes('python') || lower.includes('javascript')) {
                return "💻 **Programming Explained Step-by-Step**\n\n1️⃣ **Plan**: What should your program do? Write pseudocode\n2️⃣ **Setup**: Import libraries, define variables\n3️⃣ **Write logic**: Use loops, conditions, functions\n4️⃣ **Test**: Run with sample inputs\n5️⃣ **Debug**: Fix errors one by one\n\n🎯 Example (Python):\n```python\n# Print numbers 1 to 5\nfor i in range(1, 6):\n    print(i)\n```\n**Explanation**: `range(1,6)` creates numbers 1,2,3,4,5. The loop prints each one.\n\nWhat code would you like me to explain? 👩‍💻";
            }
            if (lower.includes('science') || lower.includes('physics') || lower.includes('chemistry')) {
                return "🔬 **Science Concept Breakdown**\n\n**Newton's First Law (Inertia)**\n- **Step 1**: An object at rest stays at rest\n- **Step 2**: An object in motion stays in motion\n- **Step 3**: Unless acted by an outside force\n- **Real-life example**: A seatbelt stops you when a car suddenly brakes!\n\n🧪 Would you like me to explain any specific science topic in detail?";
            }
            return "📚 **Hello! I'm your SBT AI Tutor**\n\nI can help you with:\n• ✏️ **Math** - Algebra, Geometry, Calculus (step-by-step)\n• 💻 **Coding** - Python, JavaScript, HTML, CSS\n• 🔬 **Science** - Physics, Chemistry, Biology\n• 📖 **English** - Grammar, Essays, Vocabulary\n• 🎯 **Study Tips** - Memory tricks, exam preparation\n\n**Just type your question**, and I'll give you a complete step-by-step explanation with examples! 🎓\n\nWhat would you like to learn today?";
        }
        
        // Helper functions
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg text-white text-xs z-50 toast-show shadow-md ${type === 'error' ? 'bg-red-500' : 'bg-gray-800 dark:bg-gray-700'}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mr-1 text-xs"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function formatDate(date) { return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
        function escapeHtml(text) { if(!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        
        function renderMarkdown(content) {
            if(typeof marked === 'undefined') return escapeHtml(content);
            try {
                return marked.parse(content, { 
                    breaks: true, 
                    highlight: function(code, lang) { 
                        if(lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value; 
                        return hljs.highlightAuto(code).value; 
                    } 
                });
            } catch(e) { return escapeHtml(content); }
        }
        
        function scrollToBottom() { setTimeout(() => { const container = document.getElementById('chat-messages-container'); if(container) container.scrollTop = container.scrollHeight; }, 80); }
        
        function startVoiceInput(onResult) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { showToast("Voice not supported", 'error'); return null; }
            const recognition = new SpeechRecognition();
            recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-US';
            recognition.onresult = (event) => { const text = event.results[0][0].transcript; if(onResult) onResult(text); };
            recognition.onerror = () => showToast("Please speak clearly", 'error');
            recognition.start();
            return recognition;
        }
        
        // ========== FIREBASE: PER-USER ISOLATED STORAGE ==========
        async function saveUserToDatabase(user) {
            try {
                const userRef = database.ref(`sbt_users/${user.uid}`);
                const snapshot = await userRef.once('value');
                if(!snapshot.exists()) {
                    await userRef.set({ email: user.email, displayName: user.displayName || user.email.split('@')[0], createdAt: new Date().toISOString() });
                }
                return true;
            } catch(e) { return false; }
        }
        
        async function saveMessageToFirebase(userId, sessionId, message) {
            try {
                const messageRef = database.ref(`sbt_users/${userId}/messages/${sessionId}`).push();
                await messageRef.set({ ...message, timestamp: new Date().toISOString() });
                const sessionRef = database.ref(`sbt_users/${userId}/sessions/${sessionId}`);
                const snap = await sessionRef.once('get');
                if(snap.exists()) {
                    const curr = snap.val();
                    await sessionRef.update({ updatedAt: new Date().toISOString(), count: (curr.count || 0) + 1 });
                }
                return true;
            } catch(e) { return false; }
        }
        
        async function createNewSession(userId, title, firstMessage) {
            try {
                const sessionsRef = database.ref(`sbt_users/${userId}/sessions`);
                const newRef = sessionsRef.push();
                const sessionId = newRef.key;
                const now = new Date().toISOString();
                await newRef.set({ id: sessionId, title: title || `Chat`, createdAt: now, updatedAt: now, count: 1 });
                await saveMessageToFirebase(userId, sessionId, firstMessage);
                return sessionId;
            } catch(e) { return null; }
        }
        
        async function loadUserSessions(userId) {
            try {
                const snapshot = await database.ref(`sbt_users/${userId}/sessions`).once('value');
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    window.sessions = Object.values(data).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                } else { window.sessions = []; }
                renderSidebar();
                return window.sessions;
            } catch(e) { window.sessions = []; renderSidebar(); return []; }
        }
        
        async function loadSessionMessages(userId, sessionId) {
            try {
                const snapshot = await database.ref(`sbt_users/${userId}/messages/${sessionId}`).once('value');
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    window.messages = Object.values(data);
                    window.currentSessionId = sessionId;
                } else { window.messages = []; }
                renderChatMessages();
                return window.messages;
            } catch(e) { window.messages = []; renderChatMessages(); return []; }
        }
        
        async function deleteSessionFromFirebase(userId, sessionId) {
            try {
                await database.ref(`sbt_users/${userId}/sessions/${sessionId}`).remove();
                await database.ref(`sbt_users/${userId}/messages/${sessionId}`).remove();
                if(window.currentSessionId === sessionId) { window.messages = []; window.currentSessionId = null; renderChatMessages(); }
                await loadUserSessions(userId);
                showToast("Chat deleted");
            } catch(e) { showToast("Delete failed", 'error'); }
        }
        
        async function updateSessionTitle(userId, sessionId, firstMsg) {
            if(!firstMsg) return;
            const shortTitle = firstMsg.length > 35 ? firstMsg.substring(0, 35) + "..." : firstMsg;
            await database.ref(`sbt_users/${userId}/sessions/${sessionId}`).update({ title: shortTitle });
            await loadUserSessions(userId);
        }
        
        // ========== SEND MESSAGE ==========
        window.sendMessage = async function(content) {
            if(!window.currentUser) { showToast("Please login", 'error'); return; }
            if(window.isGenerating) return;
            if(!content.trim()) return;
            
            const userMessage = { role: 'user', content: content.trim() };
            window.messages.push(userMessage);
            renderChatMessages();
            
            let sessionId = window.currentSessionId;
            if(!sessionId) {
                sessionId = await createNewSession(window.currentUser.uid, content.slice(0, 35), userMessage);
                if(sessionId) {
                    window.currentSessionId = sessionId;
                    await updateSessionTitle(window.currentUser.uid, sessionId, content);
                    await loadUserSessions(window.currentUser.uid);
                }
            } else {
                await saveMessageToFirebase(window.currentUser.uid, sessionId, userMessage);
                if(window.messages.length === 1) await updateSessionTitle(window.currentUser.uid, sessionId, content);
            }
            
            window.isGenerating = true;
            renderTypingIndicator(true);
            const history = window.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
            const aiResponse = await generateAIResponse(content, history);
            renderTypingIndicator(false);
            
            const aiMessage = { role: 'assistant', content: aiResponse };
            window.messages.push(aiMessage);
            if(sessionId) {
                await saveMessageToFirebase(window.currentUser.uid, sessionId, aiMessage);
                await loadUserSessions(window.currentUser.uid);
            }
            window.isGenerating = false;
            renderChatMessages();
            scrollToBottom();
        };
        
        function renderTypingIndicator(show) {
            const container = document.getElementById('chat-messages-container');
            if(!container) return;
            let indicator = document.getElementById('typing-indicator');
            if(show) {
                if(!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'typing-indicator';
                    indicator.className = 'flex justify-start mb-3 message-enter';
                    indicator.innerHTML = `<div class="bg-gray-100 dark:bg-gray-800 rounded-2xl px-4 py-2"><div class="flex gap-1"><div class="typing-dot w-1.5 h-1.5 bg-gray-400 rounded-full"></div><div class="typing-dot w-1.5 h-1.5 bg-gray-400 rounded-full"></div><div class="typing-dot w-1.5 h-1.5 bg-gray-400 rounded-full"></div></div></div>`;
                    container.appendChild(indicator);
                    scrollToBottom();
                }
            } else { if(indicator) indicator.remove(); }
        }
        
        function renderChatMessages() {
            const container = document.getElementById('chat-messages-container');
            if(!container) return;
            if(!window.messages || window.messages.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center px-4 py-8"><div class="w-14 h-14 bg-blue-500 rounded-xl flex items-center justify-center mb-4 shadow-sm"><i class="fas fa-robot text-white text-2xl"></i></div><h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-1">SBT AI Tutor</h2><p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Step-by-step explanations • Private history</p><div class="flex flex-wrap gap-2 justify-center"><span class="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-full text-xs">📐 Math</span><span class="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-full text-xs">💻 Code</span><span class="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-full text-xs">🔬 Science</span><span class="px-3 py-1.5 bg-gray-100 dark:bg-gray-800 rounded-full text-xs">📖 English</span></div><p class="text-xs text-gray-400 mt-6">Ask me any question — I'll explain step by step!</p></div>`;
                return;
            }
            let html = '<div class="max-w-3xl mx-auto px-2">';
            for(let msg of window.messages) {
                const isUser = msg.role === 'user';
                const renderedContent = isUser ? escapeHtml(msg.content) : renderMarkdown(msg.content);
                html += `<div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-3 message-enter"><div class="max-w-[85%] ${isUser ? 'bg-blue-500 text-white rounded-2xl rounded-tr-md' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-2xl rounded-tl-md'} px-3 py-2 text-sm">${!isUser ? `<div class="flex items-center gap-1.5 mb-1"><i class="fas fa-graduation-cap text-blue-500 text-xs"></i><span class="text-xs font-medium text-blue-600 dark:text-blue-400">SBT Tutor</span></div>` : ''}<div class="chat-bubble text-sm leading-relaxed">${renderedContent}</div><div class="flex items-center justify-end gap-2 mt-1.5 opacity-60"><button onclick="window.copyToClipboard(\`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)" class="text-[10px]"><i class="far fa-copy"></i></button>${!isUser ? `<button onclick="window.speakCute(\`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)" class="text-[10px]"><i class="fas fa-volume-up"></i> 🔊</button>` : ''}</div></div></div>`;
            }
            html += '</div>';
            container.innerHTML = html;
            if(typeof hljs !== 'undefined') document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            scrollToBottom();
        }
        
        window.copyToClipboard = function(text) { navigator.clipboard.writeText(text); showToast("Copied!"); };
        window.speakCute = function(text) { speakWithCuteVoice(text); };
        
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-content');
            if(!sidebar) return;
            if(!window.sessions || window.sessions.length === 0) {
                sidebar.innerHTML = `<div class="text-center text-gray-400 text-xs py-8"><i class="fas fa-comments text-2xl mb-2 opacity-50"></i><p>No chats yet</p></div>`;
                return;
            }
            sidebar.innerHTML = window.sessions.map(session => `
                <div onclick="window.loadSession('${session.id}')" class="group flex items-center justify-between p-2 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition ${window.currentSessionId === session.id ? 'bg-gray-100 dark:bg-gray-800' : ''}">
                    <div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-800 dark:text-white truncate">${escapeHtml(session.title || 'Chat')}</p><p class="text-xs text-gray-400">${formatDate(session.updatedAt)}</p></div>
                    <button onclick="event.stopPropagation(); window.deleteSession('${session.id}')" class="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-red-100 dark:hover:bg-red-900/20"><i class="fas fa-trash-alt text-red-400 text-xs"></i></button>
                </div>
            `).join('');
        }
        
        window.loadSession = async (sessionId) => {
            if(window.currentUser) {
                await loadSessionMessages(window.currentUser.uid, sessionId);
                renderSidebar();
                if(window.innerWidth < 768) toggleSidebar();
                scrollToBottom();
            }
        };
        
        window.deleteSession = async (sessionId) => {
            if(window.currentUser && confirm('Delete this chat history?')) {
                await deleteSessionFromFirebase(window.currentUser.uid, sessionId);
            }
        };
        
        window.newChat = async () => {
            window.messages = [];
            window.currentSessionId = null;
            renderChatMessages();
            renderSidebar();
            if(window.innerWidth < 768) toggleSidebar();
        };
        
        function toggleSidebar() {
            window.sidebarOpen = !window.sidebarOpen;
            const sidebarEl = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if(window.sidebarOpen) {
                sidebarEl.classList.remove('hidden');
                overlay.classList.remove('hidden');
            } else {
                sidebarEl.classList.add('hidden');
                overlay.classList.add('hidden');
            }
        }
        
        function toggleDarkMode() {
            window.darkMode = !window.darkMode;
            localStorage.setItem('darkMode', window.darkMode);
            if(window.darkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
            else { document.documentElement.classList.remove('dark'); document.body.classList.remove('dark'); }
            renderChatMessages();
        }
        
        // ========== AUTH UI ==========
        function renderAuthScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-white dark:bg-[#1e1e2f] p-4"><div class="w-full max-w-sm"><div class="text-center mb-6"><div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm"><i class="fas fa-robot text-white text-2xl"></i></div><h1 class="text-2xl font-bold text-gray-800 dark:text-white">SBT AI Tutor</h1><p class="text-sm text-gray-500 mt-1">Step-by-step learning • Private history</p></div><div id="auth-error" class="hidden mb-3 p-2 bg-red-50 text-red-500 rounded-lg text-xs text-center"></div><button onclick="window.handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition text-sm font-medium"><i class="fab fa-google text-red-500"></i>Continue with Google</button><div class="relative my-4"><div class="border-t border-gray-200 dark:border-gray-700"></div><div class="absolute inset-0 flex justify-center"><span class="px-2 bg-white dark:bg-[#1e1e2f] text-xs text-gray-400">OR</span></div></div><form id="email-login-form"><input type="email" id="login-email" placeholder="Email address" class="w-full px-3 py-2.5 mb-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:ring-1 focus:ring-blue-500" required><input type="password" id="login-password" placeholder="Password" class="w-full px-3 py-2.5 mb-3 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:ring-1 focus:ring-blue-500" required><button type="submit" class="w-full bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium hover:bg-blue-600 transition">Sign In</button></form><p class="text-center text-xs text-gray-500 mt-4">Don't have an account? <a href="#" onclick="window.showSignup()" class="text-blue-500">Create account</a></p></div></div>`;
            document.getElementById('email-login-form').addEventListener('submit', async(e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errDiv = document.getElementById('auth-error');
                try { const userCred = await auth.signInWithEmailAndPassword(email, password); await saveUserToDatabase(userCred.user); }
                catch(error) { errDiv.textContent = error.message; errDiv.classList.remove('hidden'); }
            });
        }
        
        window.showSignup = function() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-white dark:bg-[#1e1e2f] p-4"><div class="w-full max-w-sm"><div class="text-center mb-6"><div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-user-graduate text-white text-2xl"></i></div><h1 class="text-2xl font-bold text-gray-800 dark:text-white">Create Account</h1><p class="text-sm text-gray-500">Start your learning journey</p></div><div id="auth-error" class="hidden mb-3 p-2 bg-red-50 text-red-500 rounded-lg text-xs text-center"></div><button onclick="window.handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-300 rounded-xl hover:bg-gray-50 text-sm"><i class="fab fa-google text-red-500"></i>Google</button><div class="relative my-4"><div class="border-t"></div><div class="absolute inset-0 flex justify-center"><span class="px-2 bg-white dark:bg-[#1e1e2f] text-xs text-gray-400">OR</span></div></div><form id="signup-form"><input type="text" id="signup-name" placeholder="Full name" class="w-full px-3 py-2.5 mb-2 bg-gray-50 border rounded-xl text-sm" required><input type="email" id="signup-email" placeholder="Email address" class="w-full px-3 py-2.5 mb-2 bg-gray-50 border rounded-xl text-sm" required><input type="password" id="signup-password" placeholder="Password (min 6 characters)" class="w-full px-3 py-2.5 mb-3 bg-gray-50 border rounded-xl text-sm" required><button type="submit" class="w-full bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium">Sign Up</button></form><p class="text-center text-xs text-gray-500 mt-4">Already have an account? <a href="#" onclick="window.renderAuthScreen()" class="text-blue-500">Sign In</a></p></div></div>`;
            document.getElementById('signup-form').addEventListener('submit', async(e) => {
                e.preventDefault();
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                const errDiv = document.getElementById('auth-error');
                if(password.length < 6) { errDiv.textContent = 'Password must be at least 6 characters'; errDiv.classList.remove('hidden'); return; }
                try {
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await userCred.user.updateProfile({ displayName: name });
                    await saveUserToDatabase({ ...userCred.user, displayName: name });
                } catch(error) { errDiv.textContent = error.message; errDiv.classList.remove('hidden'); }
            });
        };
        
        window.handleGoogleLogin = async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { const result = await auth.signInWithPopup(provider); await saveUserToDatabase(result.user); }
            catch(error) { showToast(error.message, 'error'); }
        };
        
        window.renderAuthScreen = renderAuthScreen;
        
        // ========== MAIN CHAT UI ==========
        function renderChatUI() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="flex h-screen"><div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-40 hidden md:hidden" onclick="toggleSidebar()"></div><div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white dark:bg-[#1e1e2f] border-r border-gray-200 dark:border-gray-800 z-50 hidden md:relative md:flex flex-col"><div class="p-3 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between"><div class="flex items-center gap-2"><i class="fas fa-robot text-blue-500"></i><span class="font-semibold text-gray-800 dark:text-white text-sm">SBT Tutor</span></div><button onclick="toggleSidebar()" class="md:hidden text-gray-500">✕</button></div><div class="p-3"><button onclick="window.newChat()" class="w-full bg-blue-500 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-1"><i class="fas fa-plus text-xs"></i> New Chat</button></div><div id="sidebar-content" class="flex-1 overflow-y-auto px-2 py-2"></div><div class="p-3 border-t border-gray-200 dark:border-gray-800"><button onclick="toggleDarkMode()" class="w-full text-left text-sm text-gray-600 dark:text-gray-400 py-1.5"><i class="fas ${window.darkMode ? 'fa-sun' : 'fa-moon'} mr-2"></i>${window.darkMode ? 'Light' : 'Dark'} Mode</button><button onclick="firebase.auth().signOut()" class="w-full text-left text-sm text-red-500 py-1.5"><i class="fas fa-sign-out-alt mr-2"></i>Sign Out</button></div></div><div class="flex-1 flex flex-col h-screen overflow-hidden"><div class="border-b border-gray-200 dark:border-gray-800 px-4 py-2.5 flex items-center gap-2 bg-white dark:bg-[#1e1e2f]"><button onclick="toggleSidebar()" class="md:hidden p-1"><i class="fas fa-bars text-gray-600 text-lg"></i></button><i class="fas fa-graduation-cap text-blue-500"></i><h1 class="font-semibold text-gray-800 dark:text-white text-sm">SBT Public School AI</h1><div class="ml-auto text-xs text-gray-400"><i class="fas fa-lock text-green-500 mr-1 text-[10px]"></i>Private</div></div><div id="chat-messages-container" class="flex-1 overflow-y-auto p-3 chat-scroll bg-white dark:bg-[#1e1e2f]"></div><div class="border-t border-gray-200 dark:border-gray-800 p-3 bg-white dark:bg-[#1e1e2f]"><div class="flex gap-2"><textarea id="message-input" rows="1" placeholder="Ask me anything... I'll explain step by step" class="flex-1 px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm resize-none focus:ring-1 focus:ring-blue-500" style="min-height: 40px; max-height: 100px;"></textarea><button id="voice-btn" class="px-3 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 transition"><i class="fas fa-microphone text-gray-600 text-sm"></i></button><button id="send-btn" class="px-4 rounded-xl bg-blue-500 text-white hover:bg-blue-600 transition"><i class="fas fa-paper-plane text-sm"></i></button></div><p class="text-[10px] text-center text-gray-400 mt-2">🔒 Your chat history is private to your email account</p></div></div></div>`;
            renderChatMessages();
            loadUserSessions(window.currentUser.uid);
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const voiceBtn = document.getElementById('voice-btn');
            sendBtn.onclick = () => { const text = messageInput.value.trim(); if(text) { messageInput.value = ''; window.sendMessage(text); } };
            messageInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } };
            voiceBtn.onclick = () => { const origIcon = voiceBtn.innerHTML; voiceBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; const recog = startVoiceInput((text) => { messageInput.value = text; window.sendMessage(text); voiceBtn.innerHTML = origIcon; }); setTimeout(() => { if(recog) recog.abort(); voiceBtn.innerHTML = origIcon; }, 8000); };
        }
        
        // Initialize app
        window.messages = [];
        window.sessions = [];
        window.currentSessionId = null;
        window.isGenerating = false;
        window.darkMode = localStorage.getItem('darkMode') === 'true';
        if(window.darkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
        
        auth.onAuthStateChanged(async (user) => {
            window.currentUser = user;
            if(user) { await saveUserToDatabase(user); renderChatUI(); }
            else { renderAuthScreen(); }
        });
        
        window.speechSynthesis.getVoices();
    </script>
</body>
    </html>
