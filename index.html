<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SBT Public School | AI Study Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { 
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Mobile-optimized scrollbar */
        .chat-scroll::-webkit-scrollbar { width: 3px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .chat-scroll::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Smooth animations */
        .message-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .typing-dot { animation: typingPulse 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingPulse { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
        
        /* Mobile-first text sizes */
        .chat-bubble { 
            word-break: break-word; 
            line-height: 1.4; 
            font-size: 0.875rem;
        }
        
        /* Code blocks - mobile friendly */
        pre { 
            border-radius: 0.5rem; 
            overflow-x: auto; 
            padding: 0.625rem; 
            margin: 0.5rem 0; 
            background: #0f172a !important; 
            font-size: 0.75rem;
            -webkit-overflow-scrolling: touch;
        }
        
        code { 
            font-family: 'Courier New', monospace; 
            font-size: 0.7rem;
        }
        
        .toast-show { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        body { background: #ffffff; }
        .dark body { background: #1e1e2f; }
        
        .user-avatar { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        .three-dot-btn { transition: all 0.2s ease; }
        .three-dot-btn:active { background: #e5e7eb; }
        .dropdown-menu { animation: dropdownFade 0.12s ease-out; }
        @keyframes dropdownFade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mobile responsive adjustments */
        @media (max-width: 640px) {
            .chat-bubble { font-size: 0.8125rem; }
            pre { font-size: 0.7rem; padding: 0.5rem; }
            .message-enter { margin-bottom: 0.75rem; }
            .px-3 { padding-left: 0.625rem; padding-right: 0.625rem; }
            .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        }
        
        /* Prevent text overflow */
        .break-words { word-wrap: break-word; overflow-wrap: break-word; }
        
        /* Button tap feedback */
        button:active { transform: scale(0.96); transition: transform 0.05s; }
    </style>
</head>
<body class="bg-white dark:bg-[#1e1e2f] transition-colors duration-200">
    <div id="app" class="min-h-screen relative"></div>
    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDEw5uEL1WY6VtUZV7yaOBAuqSnwRgltFY",
            authDomain: "marriage-halls.firebaseapp.com",
            databaseURL: "https://marriage-halls-default-rtdb.firebaseio.com",
            projectId: "marriage-halls",
            storageBucket: "marriage-halls.firebasestorage.app",
            messagingSenderId: "343836708279",
            appId: "1:343836708279:web:4d55ca57685bd87fc06c32"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============================================
        // OPENROUTER API KEY
        // ============================================
        const OPENROUTER_API_KEY = "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";
        const OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions";
        
        let isRequestInProgress = false;
        let pendingRequests = [];
        let currentlyPlayingMessageId = null;
        let currentUtterance = null;
        
        // API Functions
        async function getAIResponse(userMessage, history = []) {
            try {
                const messages = [
                    {
                        role: "system",
                        content: `You are "SBT Public School AI Tutor" - a warm, patient teacher for students.

RULES:
- Explain EVERY topic STEP-BY-STEP like teaching a student
- Use simple language and emojis 😊
- For math: show formula → substitute → calculate → answer
- For coding: show code → explain each line → output
- Keep responses clear and concise
- End with a friendly follow-up question`
                    },
                    { role: "user", content: userMessage }
                ];
                
                if (history && history.length > 0) {
                    const recentHistory = history.slice(-6);
                    for (const msg of recentHistory) {
                        messages.push({
                            role: msg.role === 'user' ? 'user' : 'assistant',
                            content: msg.content
                        });
                    }
                }
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);
                
                const response = await fetch(OPENROUTER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                        'HTTP-Referer': 'https://sbt-public-school.edu',
                        'X-Title': 'SBT AI Study Assistant'
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.0-flash-lite-001",
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 800,
                        top_p: 0.95
                    }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const aiResponse = data.choices[0].message.content;
                    if (aiResponse && aiResponse.length > 0) {
                        return aiResponse;
                    }
                }
                
                return getFallbackResponse(userMessage);
                
            } catch(error) {
                console.error("API error:", error);
                return getFallbackResponse(userMessage);
            }
        }
        
        function getFallbackResponse(userMessage) {
            const lower = userMessage.toLowerCase();
            
            if (lower.includes('hello') || lower.includes('hi')) {
                return `👋 **Hello! Welcome to SBT Public School!**

I'm your AI tutor. I explain everything step by step.

📚 **I can help with:**
• Mathematics (Algebra, Calculus)
• Programming (Python, JavaScript)
• Science (Physics, Chemistry, Biology)
• English & Writing

**What would you like to learn today?** 🎓`;
            }
            
            if (lower.includes('math') || lower.includes('solve')) {
                return `📐 **Step-by-Step Math**

**Step 1**: Understand the problem
**Step 2**: Choose the formula
**Step 3**: Substitute values
**Step 4**: Calculate
**Step 5**: Verify answer

**Example**: 2x + 5 = 15
→ 2x = 10
→ x = 5

📝 **Want me to solve a specific problem?**`;
            }
            
            if (lower.includes('code') || lower.includes('python')) {
                return `💻 **Programming Step-by-Step**

**Step 1**: Plan the program
**Step 2**: Setup variables
**Step 3**: Write the logic
**Step 4**: Test the code
**Step 5**: Debug if needed

**Example (Python)**:
\`\`\`python
for i in range(5):
    print(i)
\`\`\`
This prints numbers 0 to 4.

👩‍💻 **What code would you like me to explain?**`;
            }
            
            return `📚 **Welcome to SBT Public School!**

I'm your AI teacher. I explain everything step by step.

**I can help with:**
• ✏️ **Mathematics** - Step-by-step solutions
• 💻 **Programming** - Python, JavaScript
• 🔬 **Science** - Physics, Chemistry
• 📖 **English** - Grammar, Essays
• 🎯 **Study Tips** - Exam prep

**Just type your question below!** 🎓

Example: "Solve 3x + 7 = 22" or "Explain Python loops"`;
        }
        
        // Queue system
        async function queueAIRequest(userMessage, history) {
            return new Promise((resolve, reject) => {
                pendingRequests.push({ userMessage, history, resolve, reject });
                processQueue();
            });
        }
        
        async function processQueue() {
            if (isRequestInProgress || pendingRequests.length === 0) return;
            isRequestInProgress = true;
            const request = pendingRequests.shift();
            try {
                const response = await getAIResponse(request.userMessage, request.history);
                request.resolve(response);
            } catch(error) {
                request.reject(error);
            } finally {
                isRequestInProgress = false;
                setTimeout(() => processQueue(), 500);
            }
        }
        
        // Voice functions
        function stopCurrentVoice() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            if (currentlyPlayingMessageId) {
                const prevBtn = document.querySelector(`.voice-btn[data-message-id="${currentlyPlayingMessageId}"]`);
                if (prevBtn) {
                    prevBtn.innerHTML = '<i class="fas fa-volume-up text-xs"></i>';
                    prevBtn.classList.remove('text-red-500');
                    prevBtn.classList.add('text-gray-500');
                }
                currentlyPlayingMessageId = null;
            }
            currentUtterance = null;
        }
        
        function speakMessage(messageId, text) {
            stopCurrentVoice();
            
            let cleanText = text.replace(/\*\*/g, '').replace(/`/g, '').replace(/#/g, '');
            cleanText = cleanText.substring(0, 1500);
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 1;
            utterance.lang = 'en-US';
            
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Google UK English Female') || v.name.includes('Samantha'));
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.onstart = () => {
                currentlyPlayingMessageId = messageId;
                const btn = document.querySelector(`.voice-btn[data-message-id="${messageId}"]`);
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-stop text-xs"></i>';
                    btn.classList.remove('text-gray-500');
                    btn.classList.add('text-red-500');
                }
            };
            
            utterance.onend = () => {
                if (currentlyPlayingMessageId === messageId) {
                    const btn = document.querySelector(`.voice-btn[data-message-id="${messageId}"]`);
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-volume-up text-xs"></i>';
                        btn.classList.remove('text-red-500');
                        btn.classList.add('text-gray-500');
                    }
                    currentlyPlayingMessageId = null;
                }
            };
            
            utterance.onerror = () => {
                if (currentlyPlayingMessageId === messageId) {
                    const btn = document.querySelector(`.voice-btn[data-message-id="${messageId}"]`);
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-volume-up text-xs"></i>';
                        btn.classList.remove('text-red-500');
                        btn.classList.add('text-gray-500');
                    }
                    currentlyPlayingMessageId = null;
                }
            };
            
            currentUtterance = utterance;
            window.speechSynthesis.speak(utterance);
        }
        
        function toggleVoice(messageId, text) {
            if (currentlyPlayingMessageId === messageId) {
                stopCurrentVoice();
            } else {
                speakMessage(messageId, text);
            }
        }
        
        // Helper functions
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-3 py-1.5 rounded-lg text-white text-xs z-50 toast-show shadow-md ${type === 'error' ? 'bg-red-500' : 'bg-gray-800'}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} mr-1 text-[10px]"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function formatDate(date) { return new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
        function escapeHtml(text) { if(!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        
        function renderMarkdown(content) {
            if(typeof marked === 'undefined') return escapeHtml(content);
            try {
                return marked.parse(content, { 
                    breaks: true, 
                    highlight: function(code, lang) { 
                        if(lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value; 
                        return hljs.highlightAuto(code).value; 
                    } 
                });
            } catch(e) { return escapeHtml(content); }
        }
        
        function scrollToBottom() { 
            setTimeout(() => { 
                const container = document.getElementById('chat-messages-container'); 
                if(container) container.scrollTop = container.scrollHeight; 
            }, 80); 
        }
        
        function startVoiceInput(onResult) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { showToast("Voice not supported", 'error'); return null; }
            const recognition = new SpeechRecognition();
            recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-US';
            recognition.onresult = (event) => { const text = event.results[0][0].transcript; if(onResult) onResult(text); };
            recognition.onerror = () => showToast("Speak clearly", 'error');
            recognition.start();
            return recognition;
        }
        
        // ========== FIREBASE FUNCTIONS ==========
        async function saveUserToDatabase(user) {
            try {
                const userRef = database.ref(`sbt_users/${user.uid}`);
                const snapshot = await userRef.once('value');
                if(!snapshot.exists()) {
                    await userRef.set({ 
                        email: user.email, 
                        displayName: user.displayName || user.email.split('@')[0], 
                        createdAt: new Date().toISOString(),
                        photoURL: user.photoURL || null
                    });
                }
                return true;
            } catch(e) { return false; }
        }
        
        async function saveMessageToFirebase(userId, sessionId, message) {
            try {
                const messageRef = database.ref(`sbt_users/${userId}/messages/${sessionId}`).push();
                await messageRef.set({ ...message, timestamp: new Date().toISOString() });
                const sessionRef = database.ref(`sbt_users/${userId}/sessions/${sessionId}`);
                const snap = await sessionRef.once('get');
                if(snap.exists()) {
                    const curr = snap.val();
                    await sessionRef.update({ updatedAt: new Date().toISOString(), count: (curr.count || 0) + 1 });
                }
                return true;
            } catch(e) { return false; }
        }
        
        async function createNewSession(userId, title, firstMessage) {
            try {
                const sessionsRef = database.ref(`sbt_users/${userId}/sessions`);
                const newRef = sessionsRef.push();
                const sessionId = newRef.key;
                const now = new Date().toISOString();
                await newRef.set({ id: sessionId, title: title || `Chat`, createdAt: now, updatedAt: now, count: 1 });
                await saveMessageToFirebase(userId, sessionId, firstMessage);
                return sessionId;
            } catch(e) { return null; }
        }
        
        async function loadUserSessions(userId) {
            try {
                const snapshot = await database.ref(`sbt_users/${userId}/sessions`).once('value');
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    window.sessions = Object.values(data).sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                } else { window.sessions = []; }
                renderSidebar();
                return window.sessions;
            } catch(e) { window.sessions = []; renderSidebar(); return []; }
        }
        
        async function loadSessionMessages(userId, sessionId) {
            try {
                const snapshot = await database.ref(`sbt_users/${userId}/messages/${sessionId}`).once('value');
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    window.messages = Object.values(data);
                    window.currentSessionId = sessionId;
                } else { window.messages = []; }
                renderChatMessages();
                return window.messages;
            } catch(e) { window.messages = []; renderChatMessages(); return []; }
        }
        
        async function deleteSessionFromFirebase(userId, sessionId) {
            try {
                await database.ref(`sbt_users/${userId}/sessions/${sessionId}`).remove();
                await database.ref(`sbt_users/${userId}/messages/${sessionId}`).remove();
                if(window.currentSessionId === sessionId) { window.messages = []; window.currentSessionId = null; renderChatMessages(); }
                await loadUserSessions(userId);
                showToast("Chat deleted");
            } catch(e) { showToast("Delete failed", 'error'); }
        }
        
        async function updateSessionTitle(userId, sessionId, firstMsg) {
            if(!firstMsg) return;
            const shortTitle = firstMsg.length > 30 ? firstMsg.substring(0, 30) + "..." : firstMsg;
            await database.ref(`sbt_users/${userId}/sessions/${sessionId}`).update({ title: shortTitle });
            await loadUserSessions(userId);
        }
        
        // ========== SEND MESSAGE ==========
        window.sendMessage = async function(content) {
            if(!window.currentUser) { showToast("Please login", 'error'); return; }
            if(window.isGenerating) { showToast("Please wait...", 'error'); return; }
            if(!content.trim()) return;
            
            const userMessage = { role: 'user', content: content.trim() };
            window.messages.push(userMessage);
            renderChatMessages();
            
            let sessionId = window.currentSessionId;
            if(!sessionId) {
                sessionId = await createNewSession(window.currentUser.uid, content.slice(0, 30), userMessage);
                if(sessionId) {
                    window.currentSessionId = sessionId;
                    await updateSessionTitle(window.currentUser.uid, sessionId, content);
                    await loadUserSessions(window.currentUser.uid);
                }
            } else {
                await saveMessageToFirebase(window.currentUser.uid, sessionId, userMessage);
                if(window.messages.length === 1) await updateSessionTitle(window.currentUser.uid, sessionId, content);
            }
            
            window.isGenerating = true;
            renderTypingIndicator(true);
            
            const history = window.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
            const aiResponse = await queueAIRequest(content, history);
            
            renderTypingIndicator(false);
            
            const aiMessage = { role: 'assistant', content: aiResponse };
            window.messages.push(aiMessage);
            if(sessionId) {
                await saveMessageToFirebase(window.currentUser.uid, sessionId, aiMessage);
                await loadUserSessions(window.currentUser.uid);
            }
            
            window.isGenerating = false;
            renderChatMessages();
            scrollToBottom();
        };
        
        function renderTypingIndicator(show) {
            const container = document.getElementById('chat-messages-container');
            if(!container) return;
            let indicator = document.getElementById('typing-indicator');
            if(show) {
                if(!indicator) {
                    indicator = document.createElement('div');
                    indicator.id = 'typing-indicator';
                    indicator.className = 'flex justify-start mb-2 message-enter';
                    indicator.innerHTML = `<div class="bg-gray-100 dark:bg-gray-800 rounded-2xl px-3 py-1.5"><div class="flex gap-1"><div class="typing-dot w-1.5 h-1.5 bg-gray-400 rounded-full"></div><div class="typing-dot w-1.5 h-1.5 bg-gray-400 rounded-full"></div><div class="typing-dot w-1.5 h-1.5 bg-gray-400 rounded-full"></div></div><span class="text-[10px] text-gray-500 ml-1">Typing...</span></div>`;
                    container.appendChild(indicator);
                    scrollToBottom();
                }
            } else { if(indicator) indicator.remove(); }
        }
        
        function renderChatMessages() {
            const container = document.getElementById('chat-messages-container');
            if(!container) return;
            
            if(!window.messages || window.messages.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center px-4 py-8"><div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center mb-3 shadow-sm"><i class="fas fa-school text-white text-xl"></i></div><h2 class="text-base font-semibold text-gray-800 dark:text-white mb-1">Welcome to SBT Public School</h2><p class="text-xs text-gray-500 dark:text-gray-400 mb-3">Step-by-step explanations</p><div class="flex flex-wrap gap-1.5 justify-center"><span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 rounded-full text-[11px]">📐 Math</span><span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 rounded-full text-[11px]">💻 Code</span><span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 rounded-full text-[11px]">🔬 Science</span></div><p class="text-[11px] text-gray-400 mt-4">Ask any question — I'll explain step by step!</p></div>`;
                return;
            }
            
            let html = '<div class="max-w-3xl mx-auto px-2">';
            for(let i = 0; i < window.messages.length; i++) {
                const msg = window.messages[i];
                const isUser = msg.role === 'user';
                const messageId = `msg_${Date.now()}_${i}`;
                const renderedContent = isUser ? escapeHtml(msg.content) : renderMarkdown(msg.content);
                
                if (isUser) {
                    html += `<div class="flex justify-end mb-2 message-enter"><div class="max-w-[80%] bg-blue-500 text-white rounded-2xl rounded-tr-md px-3 py-1.5 text-sm"><div class="chat-bubble break-words">${renderedContent}</div><div class="flex justify-end mt-0.5 opacity-50"><button onclick="window.copyToClipboard(\`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)" class="text-[9px] hover:opacity-100"><i class="far fa-copy"></i></button></div></div></div>`;
                } else {
                    html += `<div class="flex justify-start mb-2 message-enter"><div class="max-w-[80%] bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-2xl rounded-tl-md px-3 py-1.5 text-sm"><div class="flex items-center gap-1 mb-0.5"><i class="fas fa-graduation-cap text-blue-500 text-[10px]"></i><span class="text-[10px] font-medium text-blue-600 dark:text-blue-400">SBT Tutor</span></div><div class="chat-bubble break-words">${renderedContent}</div><div class="flex items-center justify-end gap-2 mt-0.5 opacity-50"><button onclick="window.copyToClipboard(\`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)" class="text-[9px] hover:opacity-100"><i class="far fa-copy"></i></button><button class="voice-btn text-[9px] hover:opacity-100 text-gray-500" data-message-id="${messageId}" onclick="window.toggleVoiceMessage('${messageId}', \`${escapeHtml(msg.content).replace(/`/g, '\\`')}\`)"><i class="fas fa-volume-up text-[10px]"></i></button></div></div></div>`;
                }
            }
            html += '</div>';
            container.innerHTML = html;
            
            if(typeof hljs !== 'undefined') {
                document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            }
            scrollToBottom();
        }
        
        window.copyToClipboard = function(text) { 
            navigator.clipboard.writeText(text); 
            showToast("Copied!"); 
        };
        window.toggleVoiceMessage = function(messageId, text) { toggleVoice(messageId, text); };
        
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-content');
            if(!sidebar) return;
            if(!window.sessions || window.sessions.length === 0) {
                sidebar.innerHTML = `<div class="text-center text-gray-400 text-[11px] py-6"><i class="fas fa-comments text-xl mb-2 opacity-50"></i><p>No chats yet</p></div>`;
                return;
            }
            sidebar.innerHTML = window.sessions.map(session => `
                <div onclick="window.loadSession('${session.id}')" class="group flex items-center justify-between p-2 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition ${window.currentSessionId === session.id ? 'bg-gray-100 dark:bg-gray-800' : ''}">
                    <div class="flex-1 min-w-0"><p class="text-xs font-medium text-gray-800 dark:text-white truncate">${escapeHtml(session.title || 'Chat')}</p><p class="text-[10px] text-gray-400">${formatDate(session.updatedAt)}</p></div>
                    <button onclick="event.stopPropagation(); window.deleteSession('${session.id}')" class="opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-red-100"><i class="fas fa-trash-alt text-red-400 text-[10px]"></i></button>
                </div>
            `).join('');
        }
        
        window.loadSession = async (sessionId) => {
            if(window.currentUser) {
                stopCurrentVoice();
                await loadSessionMessages(window.currentUser.uid, sessionId);
                renderSidebar();
                if(window.innerWidth < 768) toggleSidebar();
                scrollToBottom();
            }
        };
        
        window.deleteSession = async (sessionId) => {
            if(window.currentUser && confirm('Delete this chat?')) {
                stopCurrentVoice();
                await deleteSessionFromFirebase(window.currentUser.uid, sessionId);
            }
        };
        
        window.newChat = async () => {
            stopCurrentVoice();
            window.messages = [];
            window.currentSessionId = null;
            renderChatMessages();
            renderSidebar();
            if(window.innerWidth < 768) toggleSidebar();
        };
        
        function toggleSidebar() {
            window.sidebarOpen = !window.sidebarOpen;
            const sidebarEl = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if(window.sidebarOpen) {
                sidebarEl.classList.remove('hidden');
                overlay.classList.remove('hidden');
            } else {
                sidebarEl.classList.add('hidden');
                overlay.classList.add('hidden');
            }
        }
        
        function toggleDarkMode() {
            window.darkMode = !window.darkMode;
            localStorage.setItem('darkMode', window.darkMode);
            if(window.darkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
            else { document.documentElement.classList.remove('dark'); document.body.classList.remove('dark'); }
            renderChatMessages();
        }
        
        // Profile dropdown
        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        }
        
        function updateUserProfileUI() {
            const user = window.currentUser;
            if (!user) return;
            const displayName = user.displayName || user.email?.split('@')[0] || 'Student';
            const email = user.email || '';
            const initial = displayName.charAt(0).toUpperCase();
            const photoURL = user.photoURL;
            const createdAt = user.metadata?.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString() : 'Recently';
            
            const nameEl = document.getElementById('dropdown-user-name');
            const emailEl = document.getElementById('dropdown-user-email');
            const initialEl = document.getElementById('dropdown-user-initial');
            const avatarImg = document.getElementById('dropdown-avatar-img');
            const memberSpan = document.getElementById('member-since');
            
            if (nameEl) nameEl.textContent = displayName;
            if (emailEl) emailEl.textContent = email;
            if (memberSpan) memberSpan.textContent = `Member since ${createdAt}`;
            
            if (photoURL && avatarImg) {
                avatarImg.src = photoURL;
                avatarImg.classList.remove('hidden');
                if (initialEl) initialEl.classList.add('hidden');
            } else if (avatarImg) {
                avatarImg.classList.add('hidden');
                if (initialEl) { initialEl.textContent = initial; initialEl.classList.remove('hidden'); }
            }
        }
        
        // Auth UI
        function renderAuthScreen() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-white dark:bg-[#1e1e2f] p-4"><div class="w-full max-w-sm"><div class="text-center mb-5"><div class="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-school text-white text-xl"></i></div><h1 class="text-xl font-bold text-gray-800 dark:text-white">SBT Public School</h1><p class="text-xs text-gray-500 mt-1">AI Study Assistant</p></div><div id="auth-error" class="hidden mb-3 p-2 bg-red-50 text-red-500 rounded-lg text-xs text-center"></div><button onclick="window.handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-300 rounded-xl hover:bg-gray-50 text-sm"><i class="fab fa-google text-red-500"></i> Continue with Google</button><div class="relative my-4"><div class="border-t border-gray-200"></div><div class="absolute inset-0 flex justify-center"><span class="px-2 bg-white dark:bg-[#1e1e2f] text-[11px] text-gray-400">OR</span></div></div><form id="email-login-form"><input type="email" id="login-email" placeholder="Email" class="w-full px-3 py-2.5 mb-2 bg-gray-50 border rounded-xl text-sm" required><input type="password" id="login-password" placeholder="Password" class="w-full px-3 py-2.5 mb-3 bg-gray-50 border rounded-xl text-sm" required><button type="submit" class="w-full bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium">Sign In</button></form><p class="text-center text-xs text-gray-500 mt-4">New? <a href="#" onclick="window.showSignup()" class="text-blue-500">Create account</a></p></div></div>`;
            document.getElementById('email-login-form').addEventListener('submit', async(e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                const errDiv = document.getElementById('auth-error');
                try { const userCred = await auth.signInWithEmailAndPassword(email, password); await saveUserToDatabase(userCred.user); }
                catch(error) { errDiv.textContent = error.message; errDiv.classList.remove('hidden'); }
            });
        }
        
        window.showSignup = function() {
            const app = document.getElementById('app');
            app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-white dark:bg-[#1e1e2f] p-4"><div class="w-full max-w-sm"><div class="text-center mb-5"><div class="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-3"><i class="fas fa-user-graduate text-white text-xl"></i></div><h1 class="text-xl font-bold text-gray-800 dark:text-white">Create Account</h1><p class="text-xs text-gray-500">Start learning with AI</p></div><div id="auth-error" class="hidden mb-3 p-2 bg-red-50 text-red-500 rounded-lg text-xs text-center"></div><button onclick="window.handleGoogleLogin()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-300 rounded-xl hover:bg-gray-50 text-sm"><i class="fab fa-google text-red-500"></i> Google</button><div class="relative my-4"><div class="border-t"></div><div class="absolute inset-0 flex justify-center"><span class="px-2 bg-white text-[11px] text-gray-400">OR</span></div></div><form id="signup-form"><input type="text" id="signup-name" placeholder="Full name" class="w-full px-3 py-2.5 mb-2 bg-gray-50 border rounded-xl text-sm" required><input type="email" id="signup-email" placeholder="Email" class="w-full px-3 py-2.5 mb-2 bg-gray-50 border rounded-xl text-sm" required><input type="password" id="signup-password" placeholder="Password (min 6)" class="w-full px-3 py-2.5 mb-3 bg-gray-50 border rounded-xl text-sm" required><button type="submit" class="w-full bg-blue-500 text-white py-2.5 rounded-xl text-sm font-medium">Sign Up</button></form><p class="text-center text-xs text-gray-500 mt-4">Already have an account? <a href="#" onclick="window.renderAuthScreen()" class="text-blue-500">Sign In</a></p></div></div>`;
            document.getElementById('signup-form').addEventListener('submit', async(e) => {
                e.preventDefault();
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                const errDiv = document.getElementById('auth-error');
                if(password.length < 6) { errDiv.textContent = 'Password too short'; errDiv.classList.remove('hidden'); return; }
                try {
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await userCred.user.updateProfile({ displayName: name });
                    await saveUserToDatabase({ ...userCred.user, displayName: name });
                } catch(error) { errDiv.textContent = error.message; errDiv.classList.remove('hidden'); }
            });
        };
        
        window.handleGoogleLogin = async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try { const result = await auth.signInWithPopup(provider); await saveUserToDatabase(result.user); }
            catch(error) { showToast(error.message, 'error'); }
        };
        
        window.renderAuthScreen = renderAuthScreen;
        
        // Main Chat UI
        function renderChatUI() {
            const user = window.currentUser;
            const displayName = user?.displayName || user?.email?.split('@')[0] || 'Student';
            const email = user?.email || '';
            const initial = displayName.charAt(0).toUpperCase();
            const photoURL = user?.photoURL;
            const createdAt = user?.metadata?.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString() : 'Recently';
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex h-screen">
                    <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>
                    <div id="sidebar" class="fixed top-0 left-0 h-full w-56 bg-white dark:bg-[#1e1e2f] border-r border-gray-200 dark:border-gray-800 z-50 hidden md:relative md:flex flex-col">
                        <div class="p-2.5 border-b flex items-center justify-between">
                            <div class="flex items-center gap-1.5"><i class="fas fa-school text-blue-500 text-sm"></i><span class="font-semibold text-gray-800 dark:text-white text-xs">SBT Public School</span></div>
                            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 text-sm">✕</button>
                        </div>
                        <div class="p-2.5"><button onclick="window.newChat()" class="w-full bg-blue-500 text-white py-1.5 rounded-lg text-xs font-medium flex items-center justify-center gap-1"><i class="fas fa-plus text-[10px]"></i> New Chat</button></div>
                        <div id="sidebar-content" class="flex-1 overflow-y-auto px-1.5 py-1"></div>
                        <div class="p-2.5 border-t"><button onclick="toggleDarkMode()" class="w-full text-left text-xs text-gray-600 dark:text-gray-400 py-1"><i class="fas ${window.darkMode ? 'fa-sun' : 'fa-moon'} mr-1.5 text-[10px]"></i>${window.darkMode ? 'Light' : 'Dark'} Mode</button><button onclick="firebase.auth().signOut()" class="w-full text-left text-xs text-red-500 py-1"><i class="fas fa-sign-out-alt mr-1.5 text-[10px]"></i>Sign Out</button></div>
                    </div>
                    <div class="flex-1 flex flex-col h-screen overflow-hidden">
                        <div class="border-b px-3 py-2 flex items-center justify-between bg-white dark:bg-[#1e1e2f]">
                            <div class="flex items-center gap-1.5"><button onclick="toggleSidebar()" class="md:hidden p-1"><i class="fas fa-bars text-gray-600 text-sm"></i></button><i class="fas fa-school text-blue-500 text-sm"></i><h1 class="font-medium text-gray-800 dark:text-white text-xs">Welcome to SBT Public School</h1></div>
                            <div class="flex items-center gap-2"><div class="flex items-center gap-1"><div id="api-status-dot" class="w-1.5 h-1.5 rounded-full bg-green-500"></div><span id="api-status-text" class="text-[10px] text-green-600">AI Ready</span></div><div class="relative"><button onclick="toggleProfileDropdown()" class="three-dot-btn w-7 h-7 rounded-full flex items-center justify-center"><i class="fas fa-ellipsis-v text-gray-600 text-xs"></i></button><div id="profile-dropdown" class="dropdown-menu hidden absolute right-0 mt-1 w-64 bg-white dark:bg-gray-800 rounded-xl shadow-lg border z-50 overflow-hidden"><div class="p-3 border-b flex items-center gap-2"><div class="w-9 h-9 rounded-full user-avatar flex items-center justify-center text-white font-semibold text-sm overflow-hidden"><img id="dropdown-avatar-img" src="${photoURL || ''}" class="w-full h-full object-cover ${photoURL ? '' : 'hidden'}"><span id="dropdown-user-initial" class="${photoURL ? 'hidden' : ''}">${initial}</span></div><div><p id="dropdown-user-name" class="text-sm font-semibold truncate">${escapeHtml(displayName)}</p><p id="dropdown-user-email" class="text-[10px] text-gray-500 truncate">${escapeHtml(email)}</p></div></div><div class="p-1.5"><div class="px-2 py-1.5 text-[10px] text-gray-500"><i class="fas fa-calendar-alt mr-1.5 w-3"></i><span id="member-since">Member since ${createdAt}</span></div><button onclick="toggleDarkMode()" class="w-full text-left px-2 py-1.5 text-xs text-gray-700 hover:bg-gray-100 rounded-lg"><i class="fas ${window.darkMode ? 'fa-sun' : 'fa-moon'} mr-1.5 w-3 text-[10px]"></i>${window.darkMode ? 'Light Mode' : 'Dark Mode'}</button><button onclick="firebase.auth().signOut()" class="w-full text-left px-2 py-1.5 text-xs text-red-500 hover:bg-red-50 rounded-lg mt-0.5"><i class="fas fa-sign-out-alt mr-1.5 w-3 text-[10px]"></i>Sign Out</button></div></div></div></div>
                        </div>
                        <div id="chat-messages-container" class="flex-1 overflow-y-auto p-2 chat-scroll bg-white dark:bg-[#1e1e2f]"></div>
                        <div class="border-t p-2 bg-white dark:bg-[#1e1e2f]">
                            <div class="flex gap-1.5"><textarea id="message-input" rows="1" placeholder="Ask me anything..." class="flex-1 px-2.5 py-2 bg-gray-50 dark:bg-gray-800 border rounded-xl text-sm resize-none focus:ring-1 focus:ring-blue-500 text-sm" style="min-height: 38px; max-height: 80px;"></textarea><button id="voice-btn" class="px-2.5 rounded-xl bg-gray-100 dark:bg-gray-800"><i class="fas fa-microphone text-gray-600 text-sm"></i></button><button id="send-btn" class="px-3 rounded-xl bg-blue-500 text-white"><i class="fas fa-paper-plane text-sm"></i></button></div>
                            <p class="text-[9px] text-center text-gray-400 mt-1.5">🔒 Private history • Click 🔊 on AI message to listen</p>
                        </div>
                    </div>
                </div>
            `;
            
            updateUserProfileUI();
            renderChatMessages();
            loadUserSessions(window.currentUser.uid);
            
            const sendBtn = document.getElementById('send-btn');
            const messageInput = document.getElementById('message-input');
            const voiceBtn = document.getElementById('voice-btn');
            
            sendBtn.onclick = () => { const text = messageInput.value.trim(); if(text) { messageInput.value = ''; window.sendMessage(text); } };
            messageInput.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } };
            voiceBtn.onclick = () => { const origIcon = voiceBtn.innerHTML; voiceBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>'; const recog = startVoiceInput((text) => { messageInput.value = text; window.sendMessage(text); voiceBtn.innerHTML = origIcon; }); setTimeout(() => { if(recog) recog.abort(); voiceBtn.innerHTML = origIcon; }, 8000); };
        }
        
        // Initialize
        window.messages = [];
        window.sessions = [];
        window.currentSessionId = null;
        window.isGenerating = false;
        window.darkMode = localStorage.getItem('darkMode') === 'true';
        if(window.darkMode) { document.documentElement.classList.add('dark'); document.body.classList.add('dark'); }
        
        auth.onAuthStateChanged(async (user) => {
            window.currentUser = user;
            if(user) { await saveUserToDatabase(user); renderChatUI(); }
            else { renderAuthScreen(); }
        });
        
        window.speechSynthesis.getVoices();
    </script>
</body>
    </html>
